version: '3.8'

services:
  # MySQL 8.0 Relational Database
  mysql:
    image: mysql:8.0
    container_name: stylecart_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: stylecart_db
      MYSQL_USER: stylecart_user
      MYSQL_PASSWORD: stylecart_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot 3 Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stylecart_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: stylecart_db
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      APP_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8080:8080"

  # React Frontend (Vite)
  frontend:
    image: node:20-alpine
    container_name: stylecart_frontend
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend

volumes:
  mysql_data:
